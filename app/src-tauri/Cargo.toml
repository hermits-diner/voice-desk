[package]
name = "voice-desk"
version = "0.1.0"
description = "VoiceDesk"
authors = ["voice-desk"]
edition = "2021"

[lib]
name = "voice_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  # CreateJobObjectW 가 SECURITY_ATTRIBUTES 를 받아서 필요하다
  "Win32_Security",
  # JOBOBJECT_EXTENDED_LIMIT_INFORMATION 이 여기 게이트에 걸려 있다
  "Win32_System_Threading",
] }

[profile.release]
opt-level = "s"
lto = true
strip = true
